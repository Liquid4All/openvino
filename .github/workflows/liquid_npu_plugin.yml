name: Liquid NPU plugin build

# Builds only openvino_intel_npu_plugin.dll so it can replace the one in the nightly wheel of the
# same base commit.
on:
  workflow_dispatch:
  push:
    branches: ['ykhrustalev/npuw-*']

permissions: read-all

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install Ninja
        run: python -m pip install ninja

      - name: Configure
        run: >-
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_INTEL_NPU=ON -DENABLE_INTEL_CPU=OFF -DENABLE_INTEL_GPU=OFF
          -DENABLE_AUTO=OFF -DENABLE_AUTO_BATCH=OFF -DENABLE_HETERO=OFF -DENABLE_MULTI=OFF -DENABLE_TEMPLATE=OFF
          -DENABLE_OV_ONNX_FRONTEND=OFF -DENABLE_OV_PADDLE_FRONTEND=OFF -DENABLE_OV_TF_FRONTEND=OFF
          -DENABLE_OV_TF_LITE_FRONTEND=OFF -DENABLE_OV_PYTORCH_FRONTEND=OFF -DENABLE_OV_JAX_FRONTEND=OFF
          -DENABLE_OV_GGUF_FRONTEND=OFF
          -DENABLE_PYTHON=OFF -DENABLE_WHEEL=OFF -DENABLE_TESTS=OFF -DENABLE_SAMPLES=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON

      - name: Build
        run: cmake --build build --config Release --target openvino_intel_npu_plugin --parallel 4

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          # OpenVINO links binaries into bin/ under the source tree, not the build tree.
          Copy-Item bin/intel64/Release/openvino_intel_npu_plugin.dll, bin/intel64/Release/openvino_intel_npu_plugin.pdb -Destination out
          git rev-parse HEAD | Out-File out/commit.txt
          Get-ChildItem out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npu-plugin-${{ github.sha }}
          path: out
